<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-label="Foysal Ahammad - embedded, android, lua, telegram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/><stop offset="55%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#04120c"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2bd6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2bd6"/><stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff41" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cx="1010" cy="60" r="300" fill="url(#glowM)"/>
  <circle cx="120" cy="380" r="280" fill="url(#glowG)"/>
  <circle cx="640" cy="400" r="240" fill="url(#glowC)"/>

  <!-- CRT scan line -->
  <rect width="1200" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;420" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD frame -->
  <g stroke="#00ff41" stroke-opacity="0.85" stroke-width="2.5" fill="none">
    <path d="M26 78 V26 H78"/><path d="M1174 78 V26 H1122"/>
    <path d="M26 342 V394 H78"/><path d="M1174 342 V394 H1122"/>
  </g>

  <!-- terminal window -->
  <g>
    <rect x="56" y="70" width="700" height="240" rx="10" fill="#050810" fill-opacity="0.92"
          stroke="#00ff41" stroke-opacity="0.55"/>
    <rect x="56" y="70" width="700" height="34" rx="10" fill="#0b1220"/>
    <rect x="56" y="94" width="700" height="10" fill="#0b1220"/>
    <circle cx="80" cy="87" r="6" fill="#ff2bd6"/>
    <circle cx="100" cy="87" r="6" fill="#ffb300"/>
    <circle cx="120" cy="87" r="6" fill="#00ff41"/>
    <text x="406" y="92" text-anchor="middle" font-family="Fira Code, Consolas, monospace"
          font-size="14" fill="#7f93ad" letter-spacing="1">foysal@github:~</text>

    <text x="78" y="146" font-family="Fira Code, Consolas, monospace" font-size="22" fill="#ff2bd6">$</text>
    <text x="102" y="146" font-family="Fira Code, Consolas, monospace" font-size="22" fill="#e6edf3">whoami</text>
    <text x="78" y="196" font-family="Fira Code, Consolas, monospace" font-size="22" fill="#00ff41">&#62;</text>
    <text x="102" y="196" font-family="Fira Code, Consolas, monospace" font-size="26" font-weight="700"
          fill="url(#title)">Foysal Ahammad</text>
    <text x="78" y="240" font-family="Fira Code, Consolas, monospace" font-size="17" fill="#00e5ff">embedded &#183; android &#183; lua &#183; telegram</text>
    <text x="78" y="278" font-family="Fira Code, Consolas, monospace" font-size="20" fill="#ffb300">$</text>
    <rect x="100" y="262" width="13" height="22" fill="#00ff41">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- glitch layer -->
  <g font-family="Fira Code, Consolas, monospace" font-size="34" font-weight="700" fill="#ff2bd6"
     opacity="0.55" filter="url(#soft)">
    <text x="790" y="150">FOYSAL</text>
    <animate attributeName="x" values="790;786;792;790" dur="3.4s" repeatCount="indefinite"/>
  </g>
  <text x="788" y="148" font-family="Fira Code, Consolas, monospace" font-size="34" font-weight="700"
        fill="#00e5ff" opacity="0.9">FOYSAL</text>
  <text x="788" y="204" font-family="Fira Code, Consolas, monospace" font-size="34" font-weight="700"
        fill="#00ff41" opacity="0.9">AHAMMAD</text>
  <rect x="788" y="222" width="330" height="4" rx="2" fill="url(#bar)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <text x="788" y="262" font-family="Fira Code, Consolas, monospace" font-size="15" fill="#8ea3bd">
    build &#183; flash &#183; break &#183; repeat
  </text>
  <text x="788" y="300" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#00ff41">
    [ STATUS: ONLINE ]
    <animate attributeName="fill" values="#00ff41;#ff2bd6;#00ff41" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- chips -->
  <g><rect x="64" y="330" width="67" height="34" rx="6" fill="#000000" fill-opacity="0.5" stroke="#00ff41" stroke-opacity="0.55"/><text x="97" y="352" font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">ESP32</text></g>
  <g><rect x="141" y="330" width="83" height="34" rx="6" fill="#000000" fill-opacity="0.5" stroke="#00ff41" stroke-opacity="0.55"/><text x="182" y="352" font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">ESP8266</text></g>
  <g><rect x="234" y="330" width="83" height="34" rx="6" fill="#000000" fill-opacity="0.5" stroke="#00ff41" stroke-opacity="0.55"/><text x="275" y="352" font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">ANDROID</text></g>
  <g><rect x="327" y="330" width="50" height="34" rx="6" fill="#000000" fill-opacity="0.5" stroke="#00ff41" stroke-opacity="0.55"/><text x="352" y="352" font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">LUA</text></g>
  <g><rect x="387" y="330" width="91" height="34" rx="6" fill="#000000" fill-opacity="0.5" stroke="#00ff41" stroke-opacity="0.55"/><text x="432" y="352" font-family="Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">TELEGRAM</text></g>
</svg>
